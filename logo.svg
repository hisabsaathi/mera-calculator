<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Background Gradient (Blue to Green) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="50%" style="stop-color:#1d4ed8"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    
    <!-- Calculator Body Gradient (White with subtle depth) -->
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
    
    <!-- Screen Gradient (Dark) -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    
    <!-- Shadow Filter for 3D effect -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Square with Gradient -->
  <rect width="400" height="400" rx="95" fill="url(#bgGrad)"/>
  
  <!-- Subtle highlight at top of background -->
  <rect x="0" y="0" width="400" height="200" rx="95" fill="#ffffff" opacity="0.08"/>
  
  <!-- Calculator Body with 3D Shadow -->
  <g filter="url(#shadow)">
    <rect x="105" y="70" width="190" height="250" rx="28" fill="url(#calcGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  
  <!-- Top highlight on calculator body -->
  <rect x="110" y="75" width="180" height="120" rx="25" fill="#ffffff" opacity="0.6"/>
  
  <!-- Calculator Screen -->
  <rect x="125" y="90" width="150" height="55" rx="12" fill="url(#screenGrad)" stroke="#0f172a" stroke-width="1"/>
  
  <!-- Rupee symbol on screen (glowing green) -->
  <text x="265" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="34" fill="#34d399" text-anchor="end" font-weight="bold" filter="url(#innerGlow)">₹</text>
  
  <!-- Screen reflection (subtle) -->
  <rect x="130" y="95" width="140" height="20" rx="10" fill="#ffffff" opacity="0.08"/>
  
  <!-- Calculator Buttons - Row 1 -->
  <circle cx="150" cy="180" r="15" fill="#1d4ed8"/>
  <circle cx="150" cy="180" r="15" fill="#ffffff" opacity="0.15"/>
  <circle cx="200" cy="180" r="15" fill="#1d4ed8"/>
  <circle cx="200" cy="180" r="15" fill="#ffffff" opacity="0.15"/>
  <circle cx="250" cy="180" r="15" fill="#c2410c"/>
  <circle cx="250" cy="180" r="15" fill="#ffffff" opacity="0.15"/>
  
  <!-- Calculator Buttons - Row 2 -->
  <circle cx="150" cy="228" r="15" fill="#1d4ed8"/>
  <circle cx="150" cy="228" r="15" fill="#ffffff" opacity="0.15"/>
  <circle cx="200" cy="228" r="15" fill="#1d4ed8"/>
  <circle cx="200" cy="228" r="15" fill="#ffffff" opacity="0.15"/>
  <circle cx="250" cy="228" r="15" fill="#047857"/>
  <circle cx="250" cy="228" r="15" fill="#ffffff" opacity="0.15"/>
  
  <!-- Calculator Buttons - Row 3 -->
  <circle cx="150" cy="276" r="15" fill="#1d4ed8"/>
  <circle cx="150" cy="276" r="15" fill="#ffffff" opacity="0.15"/>
  <circle cx="200" cy="276" r="15" fill="#1d4ed8"/>
  <circle cx="200" cy="276" r="15" fill="#ffffff" opacity="0.15"/>
  <circle cx="250" cy="276" r="15" fill="#047857"/>
  <circle cx="250" cy="276" r="15" fill="#ffffff" opacity="0.15"/>
  
  <!-- Bottom wide button (Equals sign) -->
  <rect x="135" y="300" width="130" height="16" rx="8" fill="#047857"/>
  <rect x="135" y="300" width="130" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
  
  <!-- Sparkles (Smart effect) -->
  <circle cx="330" cy="85" r="7" fill="#fbbf24" opacity="0.95"/>
  <circle cx="345" cy="105" r="4" fill="#fbbf24" opacity="0.75"/>
  <circle cx="65" cy="325" r="5" fill="#fbbf24" opacity="0.75"/>
  <circle cx="55" cy="305" r="3" fill="#fbbf24" opacity="0.6"/>
  
</svg>